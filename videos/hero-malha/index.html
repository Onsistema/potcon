<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Potcon — A descida do sinal</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0E1418;
      }

      /* Paleta do pacote de design */
      :root {
        --canvas: #0E1418;
        --panel: #161F26;
        --steel: #243138;
        --accent: #2FBF87;
        --accent-muted: #1C6B50;
        --signal: #F2F6F4;
      }

      #viewport {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        overflow: hidden;
        background: var(--canvas);
      }

      /* ---------- O mundo alto que a camera atravessa ---------- */
      #world {
        position: absolute; top: 0; left: 0;
        width: 1920px; height: 6000px;
        will-change: transform;
      }

      /* Guias verticais quase imperceptiveis, a estrutura insinuada */
      .guide {
        position: absolute; top: 0; width: 1px; height: 6000px;
        background: linear-gradient(to bottom,
          rgba(36,49,56,0) 0%, rgba(36,49,56,.55) 12%,
          rgba(36,49,56,.55) 88%, rgba(36,49,56,0) 100%);
      }

      /* A espinha: a malha. Uma copia apagada de cima a baixo, */
      /* e uma copia acesa que cresce atras do pulso.           */
      #spine-dim {
        position: absolute; left: 959px; top: 0;
        width: 2px; height: 6000px;
        background: var(--steel);
      }
      #spine-lit {
        position: absolute; left: 958px; top: 0;
        width: 4px; height: 6000px;
        transform-origin: top center;
        background: var(--accent);
        box-shadow: 0 0 14px rgba(47,191,135,.75), 0 0 46px rgba(47,191,135,.30);
      }

      /* ---------- Camada 1: campo, os sensores ---------- */
      .sensor {
        position: absolute;
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--steel);
        opacity: .35;
      }
      .sensor-stem {
        position: absolute;
        height: 1px;
        background: var(--steel);
        opacity: .28;
      }

      /* ---------- Camada 2: controle, as trilhas ---------- */
      #traces { position: absolute; left: 0; top: 2700px; width: 1920px; height: 700px; }
      #traces path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.6;
        stroke-linecap: square;
        filter: drop-shadow(0 0 5px rgba(47,191,135,.55));
      }
      #traces .trace-base {
        stroke: var(--steel);
        stroke-width: 1.6;
        filter: none;
        opacity: .5;
      }
      .node {
        position: absolute;
        width: 7px; height: 7px;
        background: var(--accent);
        transform: rotate(45deg);
        opacity: 0;
        box-shadow: 0 0 10px rgba(47,191,135,.8);
      }

      /* ---------- Camada 3: supervisao, a convergencia ---------- */
      #converge { position: absolute; left: 0; top: 3950px; width: 1920px; height: 620px; }
      #converge path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3.2;
        stroke-linecap: round;
        filter: drop-shadow(0 0 9px rgba(47,191,135,.6));
      }
      #converge .conv-base {
        stroke: var(--steel);
        stroke-width: 3.2;
        filter: none;
        opacity: .45;
      }

      /* ---------- A base: o assentamento ---------- */
      /* A base precisa ler como massa, nao como uma linha: uma superficie
         de aco logo abaixo da aresta, depois profundidade escura. */
      #plate {
        position: absolute; left: 0; top: 5560px;
        width: 1920px; height: 440px;
        background:
          linear-gradient(to bottom,
            rgba(47,191,135,.22) 0px,
            rgba(36,49,56,.98) 26px,
            rgba(28,38,45,1) 120px,
            #12191E 260px,
            #0B1114 100%);
      }
      /* Uma segunda aresta bem abaixo da primeira da profundidade a chapa */
      #plate-lip {
        position: absolute; left: 0; top: 5586px;
        width: 1920px; height: 1px;
        background: rgba(47,191,135,.20);
        opacity: 0;
      }
      #plate-edge {
        position: absolute; left: 0; top: 5558px;
        width: 1920px; height: 3px;
        background: var(--accent);
        opacity: 0;
        box-shadow: 0 0 20px rgba(47,191,135,.85), 0 0 70px rgba(47,191,135,.35);
      }
      .plate-rib {
        position: absolute;
        width: 2px;
        background: linear-gradient(to bottom,
          rgba(47,191,135,.55), rgba(47,191,135,.14) 45%, rgba(47,191,135,0));
        opacity: 0;
      }

      /* ---------- Camadas de tela (nao pertencem ao mundo) ---------- */
      #atmos {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 120% 85% at 50% 46%,
          rgba(14,20,24,0) 30%, rgba(8,12,15,.72) 100%);
      }
      #particles { position: absolute; inset: 0; pointer-events: none; }
      .p {
        position: absolute;
        border-radius: 50%;
        background: var(--accent);
      }

      /* A posicao vertical do pulso e comandada por GSAP, nunca por CSS,
         para o tween de assentamento nao brigar com um transform estatico. */
      #pulse-wrap {
        position: absolute; left: 0; top: 0;
        width: 1920px; height: 2px;
      }
      #pulse-bob { position: absolute; inset: 0; }
      #pulse-core {
        position: absolute; left: 950px; top: -9px;
        width: 20px; height: 20px; border-radius: 50%;
        background: var(--signal);
        box-shadow:
          0 0 22px rgba(242,246,244,.95),
          0 0 60px rgba(47,191,135,.85),
          0 0 150px rgba(47,191,135,.45);
      }
      #pulse-halo {
        position: absolute; left: 860px; top: -99px;
        width: 200px; height: 200px; border-radius: 50%;
        background: radial-gradient(circle,
          rgba(47,191,135,.30) 0%, rgba(47,191,135,.10) 42%, rgba(47,191,135,0) 70%);
      }
      /* O rastro curto acima do pulso, a inercia da luz */
      #pulse-trail {
        position: absolute; left: 958px; top: -220px;
        width: 4px; height: 220px;
        background: linear-gradient(to bottom,
          rgba(47,191,135,0) 0%, rgba(47,191,135,.55) 78%, rgba(242,246,244,.9) 100%);
      }

      /* O momento fisico da lente em cada travessia */
      .shock {
        position: absolute; left: 0;
        width: 1920px; height: 2px;
        background: linear-gradient(to right,
          rgba(47,191,135,0) 0%, rgba(242,246,244,.85) 50%, rgba(47,191,135,0) 100%);
        opacity: 0;
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="descida-do-sinal" class="clip" data-start="0" data-duration="10" data-track-index="1">
        <div id="viewport">
          <div id="world" data-layout-allow-overflow>
            <div id="spine-dim" data-layout-allow-overflow></div>
            <div id="spine-lit" data-layout-allow-overflow></div>
            <div id="layer-sensors"></div>
            <svg id="traces" viewBox="0 0 1920 700" preserveAspectRatio="none"></svg>
            <div id="layer-nodes"></div>
            <svg id="converge" viewBox="0 0 1920 620" preserveAspectRatio="none"></svg>
            <div id="plate" data-layout-allow-overflow></div>
            <div id="plate-edge" data-layout-allow-overflow></div>
            <div id="plate-lip" data-layout-allow-overflow></div>
            <div id="layer-ribs"></div>
          </div>

          <div id="atmos"></div>
          <div id="particles"></div>

          <div id="pulse-wrap">
            <div id="pulse-bob">
              <div id="pulse-trail"></div>
              <div id="pulse-halo" data-layout-allow-overflow></div>
              <div id="pulse-core"></div>
            </div>
          </div>

          <div class="shock" id="shock1"></div>
          <div class="shock" id="shock2"></div>
          <div class="shock" id="shock3"></div>
        </div>
      </div>
    </div>

    <script>
      /* ------------------------------------------------------------------
         Gerador pseudo-aleatorio com semente. Determinismo obrigatorio:
         todo render precisa produzir exatamente os mesmos pixels.
      ------------------------------------------------------------------ */
      function rng(seed) {
        let s = seed >>> 0;
        return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
      }

      /* ------------------------------------------------------------------
         Geometria da descida.

         O mundo tem 6000px e a janela 1080px, entao a camera percorre
         4920px. A velocidade e constante ate 7.6s e desacelera nos
         ultimos 2.4s, com as velocidades casadas na emenda para nao
         existir solavanco:

           fase 1  ease none      4249px em 7.6s   -> 559 px/s
           fase 2  power2.out      671px em 2.4s   -> comeca a 559 px/s

         O pulso fica parado na tela em y=486 e desce para y=640 no
         assentamento, para pousar na base.
      ------------------------------------------------------------------ */
      const WORLD = 6000, VIEW = 1080;
      const SCROLL = WORLD - VIEW;          // 4920
      const T1 = 7.6, T2 = 2.4;
      const RATE = SCROLL / (T1 + T2 / 2);  // 559.09 px/s
      const S1 = RATE * T1;                 // 4249.1
      const PULSE_Y0 = 486, PULSE_Y1 = 640;

      // Momento em que o pulso cruza uma altura do mundo (fase linear)
      const at = (worldY) => (worldY - PULSE_Y0) / RATE;

      /* ---------------- Guias verticais ---------------- */
      const world = document.getElementById("world");
      [300, 620, 1300, 1620].forEach((x) => {
        const g = document.createElement("div");
        g.className = "guide";
        g.style.left = x + "px";
        world.appendChild(g);
      });

      /* ---------------- Camada 1: os sensores ----------------
         Tres fileiras concentradas no terco central, para as
         colunas de legenda da pagina ficarem com espaco calmo.
      -------------------------------------------------------- */
      const sensorHost = document.getElementById("layer-sensors");
      const rndS = rng(20260902);
      const sensorRows = [1750, 1900, 2050];
      const sensors = [];
      sensorRows.forEach((rowY, r) => {
        const count = 13;
        for (let i = 0; i < count; i++) {
          const t = (i + 0.5) / count;              // 0..1 pela largura util
          const x = 520 + t * 880 + (rndS() - 0.5) * 26;
          const y = rowY + (rndS() - 0.5) * 34;
          const d = document.createElement("div");
          d.className = "sensor";
          d.style.left = x + "px";
          d.style.top = y + "px";
          sensorHost.appendChild(d);
          // haste ligando o sensor a espinha
          const stem = document.createElement("div");
          stem.className = "sensor-stem";
          const left = Math.min(x + 5, 960), right = Math.max(x + 5, 960);
          stem.style.left = left + "px";
          stem.style.width = (right - left) + "px";
          stem.style.top = (y + 5) + "px";
          sensorHost.appendChild(stem);
          sensors.push({ el: d, stem, worldY: y, order: Math.abs(t - 0.5) });
        }
      });
      // acende de dentro para fora, como o sinal se espalhando pela espinha
      sensors.sort((a, b) => a.order - b.order);

      /* ---------------- Camada 2: as trilhas de controle ----------------
         Ortogonais, densas no centro. Cada uma nasce na espinha,
         sai na horizontal, desce e volta. Desenho por dashoffset.
      ------------------------------------------------------------------ */
      const svgNS = "http://www.w3.org/2000/svg";
      const traces = document.getElementById("traces");
      const nodeHost = document.getElementById("layer-nodes");
      const rndT = rng(7788991);
      const tracePaths = [];
      const TRACE_TOP = 2700;
      for (let i = 0; i < 14; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        const yIn = 70 + Math.floor(i / 2) * 78 + (rndT() - 0.5) * 18;
        const reach = 150 + rndT() * 330;
        const drop = 34 + rndT() * 46;
        const x0 = 960;
        const x1 = 960 + side * reach;
        const y1 = yIn + drop;
        const d = `M ${x0} ${yIn} H ${x1} V ${y1} H ${x0 + side * 44}`;

        const base = document.createElementNS(svgNS, "path");
        base.setAttribute("d", d);
        base.setAttribute("class", "trace-base");
        traces.appendChild(base);

        const lit = document.createElementNS(svgNS, "path");
        lit.setAttribute("d", d);
        traces.appendChild(lit);
        tracePaths.push({ el: lit, worldY: TRACE_TOP + yIn });

        // no de decisao na ponta
        const n = document.createElement("div");
        n.className = "node";
        n.style.left = (x1 - 3.5) + "px";
        n.style.top = (TRACE_TOP + y1 - 3.5) + "px";
        nodeHost.appendChild(n);
        tracePaths[tracePaths.length - 1].node = n;
      }
      tracePaths.sort((a, b) => a.worldY - b.worldY);

      /* ---------------- Camada 3: a convergencia ----------------
         As trilhas viram poucas linhas grossas que se juntam.
      ----------------------------------------------------------- */
      const conv = document.getElementById("converge");
      const CONV_TOP = 3950;
      const convPaths = [];
      const spreads = [-620, -360, -150, 150, 360, 620];
      spreads.forEach((sx, i) => {
        const yStart = 40 + Math.abs(i - 2.5) * 26;
        const d = `M ${960 + sx} ${yStart} C ${960 + sx} ${yStart + 210}, ${960} ${yStart + 190}, ${960} ${yStart + 430}`;
        const base = document.createElementNS(svgNS, "path");
        base.setAttribute("d", d);
        base.setAttribute("class", "conv-base");
        conv.appendChild(base);
        const lit = document.createElementNS(svgNS, "path");
        lit.setAttribute("d", d);
        conv.appendChild(lit);
        convPaths.push({ el: lit, worldY: CONV_TOP + yStart });
      });

      /* ---------------- As nervuras da base ---------------- */
      const ribHost = document.getElementById("layer-ribs");
      const ribs = [];
      for (let i = 0; i < 24; i++) {
        const x = 60 + i * 78;
        const h = 150 + ((i * 37) % 110);
        const r = document.createElement("div");
        r.className = "plate-rib";
        r.style.left = x + "px";
        r.style.top = "5560px";
        r.style.height = h + "px";
        ribHost.appendChild(r);
        ribs.push({ el: r, order: Math.abs(x - 960) });
      }
      ribs.sort((a, b) => a.order - b.order);

      /* ---------------- Particulas de ambiente ---------------- */
      const pHost = document.getElementById("particles");
      const rndP = rng(31415926);
      const parts = [];
      for (let i = 0; i < 34; i++) {
        const el = document.createElement("div");
        el.className = "p";
        const size = 1.5 + rndP() * 2.6;
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.left = (rndP() * 1920) + "px";
        el.style.top = (rndP() * 1080) + "px";
        el.style.opacity = (0.10 + rndP() * 0.26).toFixed(3);
        pHost.appendChild(el);
        parts.push({ el, drift: 40 + rndP() * 130, phase: rndP() });
      }

      /* ==================================================================
         A linha do tempo. Pausada, seekable, registrada no final.
      ================================================================== */
      const tl = gsap.timeline({ paused: true });

      /* --- A camera desce --- */
      tl.to("#world", { y: -S1, duration: T1, ease: "none" }, 0)
        .to("#world", { y: -SCROLL, duration: T2, ease: "power2.out" }, T1);

      /* --- A malha acesa cresce exatamente atras do pulso --- */
      gsap.set("#spine-lit", { scaleY: PULSE_Y0 / WORLD });
      tl.to("#spine-lit", { scaleY: (S1 + PULSE_Y0) / WORLD, duration: T1, ease: "none" }, 0)
        .to("#spine-lit", { scaleY: (SCROLL + PULSE_Y1) / WORLD, duration: T2, ease: "power2.out" }, T1);

      /* --- O pulso pousa na base durante o assentamento --- */
      gsap.set("#pulse-wrap", { y: PULSE_Y0 });
      tl.to("#pulse-wrap", { y: PULSE_Y1, duration: T2, ease: "power2.out" }, T1);

      /* --- O pulso continua vivo: ondulacao curta, em elemento proprio,
             para nunca disputar a mesma propriedade com o assentamento --- */
      tl.to("#pulse-bob", {
        y: -7,
        duration: 0.45,
        ease: "sine.inOut",
        yoyo: true,
        repeat: Math.max(0, Math.floor(10 / 0.45) - 1)
      }, 0);
      tl.to("#pulse-halo", {
        scale: 1.16, opacity: 0.72,
        duration: 0.62, ease: "sine.inOut",
        yoyo: true, repeat: Math.max(0, Math.floor(10 / 0.62) - 1)
      }, 0);

      /* --- Camada 1 acende e permanece acesa --- */
      sensors.forEach((s, i) => {
        const t = Math.max(0, at(s.worldY) - 0.08);
        tl.to(s.el, {
          opacity: 1,
          backgroundColor: "#2FBF87",
          boxShadow: "0 0 12px rgba(47,191,135,.9)",
          duration: 0.34, ease: "power2.out"
        }, t + i * 0.006);
        tl.to(s.stem, {
          opacity: 0.75, backgroundColor: "#1C6B50",
          duration: 0.30, ease: "power2.out"
        }, t + i * 0.006);
      });

      /* --- Camada 2: as trilhas conduzem, nao cortam --- */
      tracePaths.forEach((p, i) => {
        const len = p.el.getTotalLength();
        gsap.set(p.el, { strokeDasharray: len, strokeDashoffset: len });
        const t = Math.max(0, at(p.worldY) - 0.10);
        tl.to(p.el, { strokeDashoffset: 0, duration: 0.52, ease: "power1.inOut" }, t);
        tl.to(p.node, { opacity: 1, duration: 0.22, ease: "power2.out" }, t + 0.46);
      });

      /* --- Camada 3: a convergencia --- */
      convPaths.forEach((p) => {
        const len = p.el.getTotalLength();
        gsap.set(p.el, { strokeDasharray: len, strokeDashoffset: len });
        const t = Math.max(0, at(p.worldY) - 0.12);
        tl.to(p.el, { strokeDashoffset: 0, duration: 0.78, ease: "power1.inOut" }, t);
      });

      /* --- A base acende quando o pulso chega --- */
      tl.to("#plate-edge", { opacity: 1, duration: 0.9, ease: "power2.out" }, 8.35);
      tl.to("#plate-lip", { opacity: 1, duration: 1.1, ease: "power2.out" }, 8.6);
      ribs.forEach((r, i) => {
        tl.to(r.el, { opacity: 1, duration: 0.5, ease: "power2.out" }, 8.55 + i * 0.018);
      });

      /* --- O momento fisico da lente em cada travessia (lei 8) --- */
      [
        { el: "#shock1", t: at(1900) },
        { el: "#shock2", t: at(3000) },
        { el: "#shock3", t: at(4180) }
      ].forEach(({ el, t }) => {
        gsap.set(el, { y: PULSE_Y0, scaleX: 0.35 });
        tl.to(el, { opacity: 0.9, scaleX: 1, duration: 0.14, ease: "power2.out" }, t - 0.07)
          .to(el, { opacity: 0, scaleX: 1.25, duration: 0.34, ease: "power2.in" }, t + 0.07);
        // o pulso ganha um brilho curto ao atravessar
        tl.to("#pulse-core", { scale: 1.5, duration: 0.12, ease: "power2.out", overwrite: "auto" }, t - 0.06)
          .to("#pulse-core", { scale: 1, duration: 0.42, ease: "power2.out", overwrite: "auto" }, t + 0.08);
      });

      /* --- Vida ambiente: as particulas derivam devagar --- */
      parts.forEach((p) => {
        tl.to(p.el, { y: p.drift, duration: 10, ease: "none" }, 0);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
